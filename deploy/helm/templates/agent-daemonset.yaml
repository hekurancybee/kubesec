apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-agent
  labels:
    app: kubesec-agent
spec:
  selector:
    matchLabels:
      app: kubesec-agent
  template:
    metadata:
      labels:
        app: kubesec-agent
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ .Release.Name }}-agent
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}-agent:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/kubesec-agent"]
          args:
            - "-clickhouse"
            - "{{ .Release.Name }}-clickhouse"
          securityContext:
            privileged: true
          volumeMounts:
            - name: debugfs
              mountPath: /sys/kernel/debug
            - name: bpffs
              mountPath: /sys/fs/bpf
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
